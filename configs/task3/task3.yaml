# Task 3 - Test-time compute: sampling, selection and adaptive inference.
# Offline steps (1, 2, 3, 5, 6) use the supplied ATML-PA3-Data rollouts; Step 4 generates on a Kaggle T4.
# Resolved copies of this file are written next to the results that used it.

seed: 6304

data:
  # Root of the supplied ATML-PA3-Data folder (override with $PA3_T3_DATA).
  root: _input/ATML-PA3-Data
  datasets:
    math: {folder: qwen25-math, label: "MATH (Qwen2.5-3B-Instruct)"}
    mathvista: {folder: qwen25vl-mathvista, label: "MathVista testmini (Qwen2.5-VL-3B-Instruct)"}
  # Released MathVista question metadata (question/answer type, choices, precision).
  mathvista_meta:
    repo: AI4Math/MathVista
    revision: 2b6ad69445fbb5695c9b165475e8decdbeb97747
    file: data/testmini-00000-of-00001-725687bf7a18d64b.parquet
    columns: [pid, choices, unit, precision, answer, question_type, answer_type]

splits:
  n_dev: 200              # first 200 of the seeded permutation of the sorted question IDs; rest = held-out eval
  n_live: 50              # first 50 MATH evaluation questions -> Step 4

offline:
  budgets: [1, 2, 4, 8, 16, 32]
  n_orders: 10            # seeded random permutations of the 32 rollout IDs per question (nested prefixes)
  bootstrap: 1000         # paired question-level resamples (after averaging over orders)
  report_split: eval      # headline numbers: held-out 800 questions; dev reported alongside
  calib_percentiles: [5, 95]   # VisConf calibration, linear interpolation, pooled over the current candidate set
  calib_eps: 1.0e-8

adaptive:
  check_points: [4, 8, 16]    # otherwise stop at 32
  max_n: 32
  tau: [0.5, 0.625, 0.75, 0.875, 1.0]
  gamma: [0.0, 0.1, 0.25, 0.5]
  tolerance_pp: 1.0           # dev accuracy may be at most 1 pp below fixed-32 self-consistency
  quality_score: {math: self_certainty, mathvista: visconf}

live:
  model: Qwen/Qwen2.5-3B-Instruct
  revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
  dtype: float16
  batch_size: 1
  sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, repetition_penalty: 1.0}
  system: "You are a helpful assistant."
  instruction: "Think step by step inside <think> </think> tags, then give your final answer inside \\boxed{}."
  review_instruction: "Review the solution above. Identify and correct any errors; if it is correct, retain its answer. Give your final answer inside \\boxed{}."
  caps: {single: 3072, parallel: 1024, n_parallel: 3, initial: 1024, revision: 2048}
  device: "cuda:0"            # every strategy timed on the same GPU

dry_run:                      # PA3_DRY_RUN=1 (Kaggle check notebook)
  live: {n_questions: 2, caps: {single: 96, parallel: 32, n_parallel: 3, initial: 32, revision: 64}}
