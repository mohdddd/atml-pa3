model: Qwen/Qwen3-0.6B
seed: 6304
enable_thinking: false
data:
  dataset: meta-math/MetaMathQA
  split: train
  n_examples: 40000
  max_len: 2048
  gsm8k_test:
  - openai/gsm8k
  - main
  - test
train:
  micro_batch: 2
  grad_accum: 16
  updates: 3
  warmup: 1
  schedule: cosine
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.01
  clip_norm: 1.0
  grad_checkpointing: true
  precision: fp16_amp
  loss_chunk_tokens: 1024
  ckpt_updates:
  - 2
  - 3
  eval_updates:
  - 2
  - 3
eval:
  tasks_gen:
  - gsm8k_cot
  tasks_ll:
  - hellaswag
  - boolq
  - arc_easy
  gsm8k_max_gen_toks: 128
  batch_size_gen: 48
  batch_size_ll: auto:4
  max_batch_size_ll: 64
  qual_max_new_tokens: 48
  qual_prompts: configs/task1/first_plot_questions.yaml
  limit: 16
probe:
  n_math: 32
  n_nonmath: 32
diagnostics:
  layers:
  - 0
  - 13
  - 27
  module: down_proj
  k: 128
method: full
lr: 2.0e-05
l2sp_lambda: 0.0
run: full_ft
dry_run: true
