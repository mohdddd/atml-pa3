model: Qwen/Qwen3-0.6B
seed: 6304
enable_thinking: false
data:
  dataset: meta-math/MetaMathQA
  split: train
  n_examples: 40000
  max_len: 2048
  gsm8k_test:
  - openai/gsm8k
  - main
  - test
train:
  micro_batch: 2
  grad_accum: 16
  updates: 1250
  warmup: 38
  schedule: cosine
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.01
  clip_norm: 1.0
  grad_checkpointing: true
  precision: fp16_amp
  loss_chunk_tokens: 1024
  ckpt_updates:
  - 312
  - 625
  - 937
  - 1250
  eval_updates:
  - 1250
eval:
  tasks_gen:
  - gsm8k_cot
  tasks_ll:
  - hellaswag
  - boolq
  - arc_easy
  gsm8k_max_gen_toks: 1024
  batch_size_gen: 48
  batch_size_ll: auto:4
  max_batch_size_ll: 64
  qual_max_new_tokens: 512
  qual_prompts: configs/task1/first_plot_questions.yaml
probe:
  n_math: 32
  n_nonmath: 32
diagnostics:
  layers:
  - 0
  - 13
  - 27
  module: down_proj
  k: 128
method: lora
lr: 0.0002
lora:
  r: 4
  alpha: 8
  dropout: 0.05
  targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
run: lora4
dry_run: false
