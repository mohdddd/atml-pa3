  mix:
    vqa: 0.7
    presence: 0.1
    counting: 0.1
    caption: 0.1
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
eval:
  max_new_tokens: 16
  batch_size: 8
  dev_batch_size: 16
  bootstrap: 4000
  conditions:
  - correct
  - complementary
  - mismatched
  - no_image
