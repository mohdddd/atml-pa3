  question: 80
  caption: 64
  answer: 16
data:
  captions:
    train_images: 6000
    captions_per_train_image: 3
    dev_images: 96
  grounding:
    presence_min_area_frac: 0.01
    counting_min_area_frac: 0.005
    counts:
    - 1
    - 2
    - 3
    - 4
    train_pool:
      presence: 3000
      counting: 2000
    dev_pairs:
      presence: 12
      counting: 12
    test_pairs:
      presence: 32
      counting: 32
  vqa:
    min_agreement: 8
    train_pairs:
      yes/no: 640
      number: 256
      other: 640
    dev_pairs:
      yes/no: 12
      number: 8
      other: 12
    test_pairs:
      yes/no: 36
      number: 24
      other: 36
train:
  micro_batch: 8
  grad_accum: 2
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  clip_norm: 1.0
  warmup_frac: 0.05
  min_lr_frac: 0.1
