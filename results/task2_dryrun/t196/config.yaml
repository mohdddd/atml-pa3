seed: 6304
lm: Qwen/Qwen3-0.6B
vision: google/siglip-base-patch16-224
enable_thinking: false
n_visual_tokens: 196
pool_2x2: false
connector:
  in_dim: 768
  hidden: 1024
  out_dim: 1024
prompts:
